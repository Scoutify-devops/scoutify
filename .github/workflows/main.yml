name: Deploy Scoutify to GitHub Pages

on:
  push:
    branches:
      - main
      - master
      - features
      - Testing
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  APP_PUBLIC_URL: https://example.com
  APP_START_PATH: /pages/login.html

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validate required app pages exist
        run: |
          test -f index.html
          test -f pages/login.html
          test -f pages/choose-role.html
          test -f pages/messages.html
          test -f pages/profile.html
          echo "Scoutify pages are available for deployment."

      - name: Confirm login is the entry page
        run: |
          echo "Public app URL: $APP_PUBLIC_URL"
          echo "Entry page: $APP_START_PATH"
          test -f pages/login.html
          echo "The app is configured to route users to the login page first."

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
