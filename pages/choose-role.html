<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Choose your side | Scoutify</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/styles.css" />
  </head>
  <body class="entry-body role-entry-body">
    <main class="role-entry-shell">
      <div class="brand"><span class="brand-mark">▶</span><span class="brand-text">Scoutify</span></div>
      <p class="eyebrow">One football community</p>
      <h1>Choose your side</h1>
      <p class="role-entry-copy">Tell us how you want to use Scoutify. This decides the home experience you see next.</p>
      <div class="role-choice-grid">
        <button class="role-choice-card" data-role-choice="scout" type="button"><span class="role-icon">🔎</span><strong>I'm a scout</strong><span>Find players, watch videos, review stats, and message talent.</span></button>
        <button class="role-choice-card" data-role-choice="player" type="button"><span class="role-icon">⚽</span><strong>I'm a player</strong><span>Post your videos and stats, then discover other players.</span></button>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
      const supabaseUrl = "https://your-project-url.supabase.co";
      const supabaseAnonKey = "your-supabase-anon-key";
      window.SUPABASE_URL = supabaseUrl;
      window.SUPABASE_ANON_KEY = supabaseAnonKey;
      window.supabase = window.supabase || window._supabase;

      function saveUserSession(user, token) {
        if (token) localStorage.setItem("scoutify_token", token);
        if (user) {
          const nextUser = {
            id: user.id || user.sub || crypto?.randomUUID?.() || Date.now().toString(),
            name: user.name || user.user_metadata?.name || user.email?.split("@")[0] || "Scoutify user",
            email: user.email,
            role: user.role || "player"
          };
          localStorage.setItem("scoutify_user", JSON.stringify(nextUser));
        }
      }

      function resolvePageUrl(fileName) {
        return new URL(fileName.startsWith("/") ? fileName : `/pages/${fileName}`, window.location.origin).toString();
      }

      function resolveHomeUrl() {
        return new URL("/index.html", window.location.origin).toString();
      }

      async function hydrateGoogleSession() {
        const params = new URLSearchParams(window.location.search);
        const token = params.get("token");
        const userParam = params.get("user");

        if (token) {
          localStorage.setItem("scoutify_token", token);
        }

        if (userParam) {
          try {
            const parsedUser = JSON.parse(decodeURIComponent(userParam));
            saveUserSession(parsedUser, token);
            return true;
          } catch {
            // Ignore malformed user payload and continue to Supabase session check.
          }
        }

        if (window.supabase && supabaseUrl && supabaseAnonKey) {
          try {
            const client = window.supabase.createClient(supabaseUrl, supabaseAnonKey);
            const { data: { session }, error } = await client.auth.getSession();
            if (!error && session?.user) {
              saveUserSession(session.user, session.access_token);
              return true;
            }
          } catch {
            // fall through to login redirect below
          }
        }

        return false;
      }

      (async function () {
        const isAuthenticated = await hydrateGoogleSession();

        if (!isAuthenticated) {
          window.location.href = resolvePageUrl("login.html");
          return;
        }

        document.querySelectorAll("[data-role-choice]").forEach((button) => {
          button.addEventListener("click", () => {
            const user = JSON.parse(localStorage.getItem("scoutify_user") || "{}");
            localStorage.setItem("scoutify_user", JSON.stringify({ ...user, role: button.dataset.roleChoice }));
            window.location.href = resolveHomeUrl();
          });
        });
      })();
    </script>
  </body>
</html>
