<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Messages | Scoutify</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/styles.css" />
  </head>
  <body class="messages-body">
    <header class="topbar messages-topbar">
      <div class="brand-group"><a class="icon-button" href="/index.html" aria-label="Back to home">←</a><div class="brand"><span class="brand-mark">▶</span><span class="brand-text">Scoutify</span></div></div>
      <div class="messages-title"><span class="eyebrow">Private conversations</span><h1>Messages</h1></div>
      <a class="soft-button" href="/index.html">Home</a>
    </header>
    <main class="dm-shell">
      <aside class="conversation-panel">
        <div class="dm-heading"><div><p class="eyebrow">Inbox</p><h2>Chats</h2></div><button class="icon-button" id="newChatButton" aria-label="Start a new chat">＋</button></div>
        <label class="dm-search"><span>⌕</span><input id="conversationSearch" type="search" placeholder="Search messages" /></label>
        <div id="conversationList" class="conversation-list"></div>
      </aside>
      <section class="chat-panel" aria-live="polite">
        <header class="chat-header"><div id="activeAvatar" class="dm-avatar avatar-blue">G</div><div><h2 id="activeName">GoalZone</h2><p id="activeMeta">Football coach · Active now</p></div><button class="icon-button" aria-label="Conversation information">ⓘ</button></header>
        <div id="chatMessages" class="chat-messages"></div>
        <form id="chatForm" class="chat-composer"><button type="button" class="composer-icon" aria-label="Add attachment">＋</button><input id="chatInput" name="text" placeholder="Message GoalZone..." autocomplete="off" required /><button class="send-button" type="submit" aria-label="Send message">➤</button></form>
      </section>
    </main>
    <script src="../assets/js/messages.js"></script>
  </body>
</html>
