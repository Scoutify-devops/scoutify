<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in | Scoutify</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/styles.css" />
  </head>
  <body class="entry-body">
    <main class="entry-shell">
      <section class="entry-intro">
        <div class="brand"><span class="brand-mark">▶</span><span class="brand-text">Scoutify</span></div>
        <p class="eyebrow">Football talent network</p>
        <h1>Where players get seen.</h1>
        <p>Share your football journey, discover rising talent, and connect through real performance videos.</p>
        <div class="entry-proof"><span>⚽</span><span>Football only</span><span>·</span><span>Players and scouts</span></div>
      </section>
      <section class="entry-card" aria-labelledby="authTitle">
        <p class="eyebrow">Scoutify account</p>
        <h2 id="authTitle">Welcome back</h2>
        <p id="authStatus" class="form-status" aria-live="polite"></p>
        <form id="authForm" class="auth-form">
          <label id="nameField">Name<input id="authName" name="name" autocomplete="name" /></label>
          <label>Email<input name="email" type="email" autocomplete="email" /></label>
          <label>Password<input name="password" type="password" autocomplete="current-password" /></label>
          <button class="primary-button" type="submit">Continue</button>
        </form>
        <button id="googleButton" class="google-button" type="button">Continue with Google</button>
        <button id="modeButton" class="text-button" type="button">New to Scoutify? Create an account</button>
      </section>
    </main>
    <script src="../assets/js/auth.js"></script>
  </body>
</html>
